name        : mdadm
version     : "4.6"
release     : 1
homepage    : https://github.com/md-raid-utilities/mdadm
upstreams   :
    - https://github.com/md-raid-utilities/mdadm/archive/refs/tags/mdadm-4.6.tar.gz : 202a7525e6f2b44395a9ef2c561082c7d6d8204e9addfe3f6268bfb141efc093
summary     : Manage Linux MD (software RAID) arrays
description : |
    mdadm is a tool for creating, assembling, managing and monitoring Linux md
    devices (also known as software RAID arrays). It can create, assemble, grow
    and monitor RAID0/1/4/5/6/10 arrays using the kernel MD driver, and supports
    both native and external metadata (IMSM, DDF).
license     : GPL-2.0-or-later
builddeps   :
    - pkgconfig(libudev)
    - pkgconfig(udev)
setup       : |
    %patch %(pkgdir)/ftbfs-clang-23.patch
build       : |
    # /run is absent in the build sandbox
    %make BINDIR=%(sbindir) CHECK_RUN_DIR=0 STRIP=
install     : |
    %make_install install-systemd \
        BINDIR=%(sbindir) \
        CHECK_RUN_DIR=0 \
        STRIP= \
        SYSTEMD_DIR=%(libdir)/systemd/system
