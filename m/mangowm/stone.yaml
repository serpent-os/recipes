name        : mangowm
version     : "0.18.2"
release     : 12
homepage    : https://github.com/mangowm/mango
upstreams   :
        - https://github.com/mangowm/mango/archive/refs/tags/0.18.2.tar.gz : 04c8a6bb168307360383670daf0f96ffa7587df6680b9030587f084121105dd3
summary     : A Wayland compositor with smooth animation
description : |
    A wayland compositor utilizing wlroots as a base and SceneFX for aesthetics
license     : GPL-3.0-or-later
builddeps   :
    - pkgconfig(libcjson)
    - pkgconfig(libpcre2-8)
    - pkgconfig(pango)
    - pkgconfig(scenefx)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wlroots)
setup       : |
    %patch %(pkgdir)/stateless-config.patch
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
