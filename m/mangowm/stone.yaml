name        : mangowm
version     : "0.18.1"
release     : 11
homepage    : https://github.com/mangowm/mango
upstreams   :
        - https://github.com/mangowm/mango/archive/refs/tags/0.18.1.tar.gz : cb7c25c3491fd8f81c0658500699b0ab3efec57b6f0517fcbaab18bd2b42dffb
summary     : A Wayland compositor with smooth animation
description : |
    A wayland compositor utilizing wlroots as a base and SceneFX for aesthetics
license     : GPL-3.0-or-later
builddeps   :
    - pkgconfig(libcjson)
    - pkgconfig(libpcre2-8)
    - pkgconfig(pango)
    - pkgconfig(scenefx)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wlroots)
setup       : |
    %patch %(pkgdir)/stateless-config.patch
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
