name        : mbedtls
version     : "3.6.7"
release     : 1
homepage    : https://www.trustedfirmware.org/projects/mbed-tls/
upstreams   :
    - https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2 : a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6
summary     : Mbed TLS is a C library that implements X.509 certificate manipulation and the TLS and DTLS protocols.
description : |
    An open source, portable, easy to use, readable and flexible TLS library, and reference implementation of the PSA Cryptography API.
license     : Apache-2.0
builddeps   :
    - binary(python3)
setup       : |
    %cmake \
        -DCMAKE_SKIP_RPATH=ON \
        -DENABLE_PROGRAMS=OFF \
        -DUSE_SHARED_MBEDTLS_LIBRARY=ON \
        -DUSE_STATIC_MBEDTLS_LIBRARY=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    # The PSA persistent-storage tests are not parallel-safe
    LD_LIBRARY_PATH=%(workdir)/%(builddir)/library %cmake_test --parallel 1
