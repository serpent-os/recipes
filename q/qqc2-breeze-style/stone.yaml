name        : qqc2-breeze-style
version     : "6.8.0"
release     : 6
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.0/qqc2-breeze-style-6.8.0.tar.xz : e92843147369836f3e348e26dd5b930739a1c13bb67f930e0a343cbded118705
homepage    : https://kde.org/plasma-desktop/
license     :
    - GPL-2.0-or-later
summary     : Breeze Style for QQC2
description : |
    Breeze inspired QQC2 Style
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6ColorScheme)
    - cmake(KF6Config)
    - cmake(KF6GuiAddons)
    - cmake(KF6IconThemes)
    - cmake(KF6Kirigami)
    - cmake(Qt6Qml)
rundeps     :
    - kf6-kquickcharts
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
