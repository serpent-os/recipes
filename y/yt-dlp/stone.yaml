name        : yt-dlp
version     : "2026.10.21"
release     : 5
homepage    : https://github.com/yt-dlp/yt-dlp
upstreams   :
    - https://github.com/yt-dlp/yt-dlp/archive/refs/tags/2026.10.21.tar.gz : d3550322daafb24e1cddc55256fbc8b3b5886cdb5793444ff1ed7c08262a56fb
summary     : yt-dlp is a feature-rich command-line audio/video downloader with support for thousands of sites
description : |
    yt-dlp is a feature-rich command-line audio/video downloader with support for thousands of sites. The project is a fork of youtube-dl based on the now inactive youtube-dlc.
license     :
    - Unlicense
builddeps   :
    - python(hatchling)
rundeps     :
    - binary(ffmpeg)
    - binary(ffprobe)
    - binary(node)
    - binary(python)
    - python(yt-dlp-ejs)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
