name        : kglobalacceld
version     : "6.8.1"
release     : 33
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.1/kglobalacceld-6.8.1.tar.xz : 33ca06aefb17ee663282fe60a6d2d7211d5832515d1f0a4387a77858bdadf219
homepage    : https://kde.org/plasma-desktop/
license     :
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
summary     : Daemon providing Global Keyboard Shortcut (Accelerator) functionality
description : |
    Daemon providing Global Keyboard Shortcut (Accelerator) functionality
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6GlobalAccel)
    - cmake(KF6JobWidgets)
    - cmake(KF6KIO)
    - cmake(KF6Service)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
