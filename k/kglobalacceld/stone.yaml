name        : kglobalacceld
version     : "6.8.0"
release     : 32
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.0/kglobalacceld-6.8.0.tar.xz : 0266bbe7a2ce0c7f859a5e7d151df18edcd5bb6bfb11681f32bf82e583b209cd
homepage    : https://kde.org/plasma-desktop/
license     :
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
summary     : Daemon providing Global Keyboard Shortcut (Accelerator) functionality
description : |
    Daemon providing Global Keyboard Shortcut (Accelerator) functionality
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6GlobalAccel)
    - cmake(KF6JobWidgets)
    - cmake(KF6KIO)
    - cmake(KF6Service)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
