name        : koko
version     : "26.08.2"
release     : 1
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/koko-26.08.2.tar.xz : f7fce0d885ac53ddd3fc30d443cbff694b5432eb0745efae0556dbfe270c5830
homepage    : https://apps.kde.org/koko/
license     :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC-BY-4.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0-only
summary     : Image viewer for desktop and touch devices
description : |
    Koko is an image viewer designed for desktop and touch devices.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6Declarative)
    - cmake(KF6FileMetaData)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6Kirigami)
    - cmake(KF6KirigamiAddons)
    - cmake(KF6KirigamiAppComponents)
    - cmake(KF6Notifications)
    - cmake(KF6Purpose)
    - cmake(KQuickImageEditor)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Positioning)
    - cmake(Qt6Qml)
    - cmake(Qt6QuickControls2)
    - cmake(Qt6Svg)
    - pkgconfig(exiv2)
    - pkgconfig(xcb-util)
rundeps     :
    # org.kde.kquickcontrolsaddons QML module; QtMultimedia QML module for video playback
    - kf6-kdeclarative
    - kf6-kirigami-addons
    - qt6-multimedia
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
