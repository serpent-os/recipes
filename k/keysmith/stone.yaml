name        : keysmith
version     : "26.08.2"
release     : 1
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/keysmith-26.08.2.tar.xz : c04c5362e3d50947a4175422f0cf9856d3218711f43da5b8bf1864dafecae256
homepage    : https://apps.kde.org/keysmith/
license     :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC-BY-SA-4.0
    - CC0-1.0
    - GPL-3.0-or-later
summary     : OTP (two-factor) token generator
description : |
    Keysmith is an application to generate two-factor authentication (2FA) tokens when logging in to your accounts. It supports both HOTP and TOTP tokens.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6Kirigami)
    - cmake(KF6KirigamiAddons)
    - cmake(KF6Prison)
    - cmake(KF6QQC2DesktopStyle)
    - cmake(KF6WindowSystem)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6QuickControls2)
    - cmake(Qt6Svg)
    - pkgconfig(libsodium)
    - pkgconfig(openssl)
rundeps     :
    - kf6-kirigami-addons
    - kf6-prison
    - kf6-qqc2-desktop-style
    - qt6-wayland
setup       : |
    %cmake_kf6 \
        -DBUILD_TESTING=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    env QT_QPA_PLATFORM=offscreen %cmake_test
