name        : kf6-kplotting
version     : "6.31.0"
release     : 1
upstreams   :
    - https://download.kde.org/stable/frameworks/6.31/kplotting-6.31.0.tar.xz : 74e22750b08fbfec8a96f5cad7382cd8680045a248c017c82ddb5ce76b85e8b6
homepage    : https://community.kde.org/Frameworks
license     :
    - CC0-1.0
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
summary     : Data plotting
description : |
    KPlotting provides KPlotWidget, a QWidget-derived class that provides a virtual base class for easy data-plotting. The idea behind KPlotWidget is that you only have to specify information in "data units"; i.e., the natural units of the data being plotted. KPlotWidget automatically converts everything to screen pixel units.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
setup       : |
    %cmake_kf6 \
        -DBUILD_TESTING=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    env QT_QPA_PLATFORM=offscreen %cmake_test
