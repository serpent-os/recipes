name        : kscreen
version     : "6.8.0"
release     : 34
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.0/kscreen-6.8.0.tar.xz : 2c0a1c82e5b050de1cca9ec1e024dd09d8eb37dc1b18a6d4b59124e2e4ca2bc8
homepage    : https://kde.org/plasma-desktop/
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-only
summary     : KDE Plasma screen management
description : |
    KDE Plasma screen management
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6ImageFormats)
    - cmake(KF6ItemModels)
    - cmake(KF6KCMUtils)
    - cmake(KF6Screen)
    - cmake(KF6Svg)
    - cmake(KF6XmlGui)
    - cmake(LayerShellQt)
    - cmake(Plasma)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6WaylandClient)
    - pkgconfig(wayland-protocols)
    - pkgconfig(xi)
    - plasma5support # QML dep
rundeps     :
    - kf6-kimageformats # Required to load HDR test image
    - kf6-kirigami # QML dep for HDR calibrator
    - plasma5support # QML dep
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
