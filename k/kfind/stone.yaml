name        : kfind
version     : "26.08.2"
release     : 1
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/kfind-26.08.2.tar.xz : 9640e7cd647da25c4b5b1549016f424a3d5b722751b23366d710849cd14d05c5
homepage    : https://apps.kde.org/kfind/
license     : GPL-2.0-or-later
summary     : Find files and folders
description : |
    KFind allows you to search for directories and files.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DocTools)
    - cmake(KF6FileMetaData)
    - cmake(KF6I18n)
    - cmake(KF6KIO)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
    - cmake(Qt6Core5Compat)
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
