name        : kompare
version     : "26.08.2"
release     : 1
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/kompare-26.08.2.tar.xz : b1bee9df5873ef81746d8069255c286c00cae179bb8ab38870f616806f61b776
homepage    : https://apps.kde.org/kompare/
license     :
    - GFDL-1.2-or-later
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
summary     : Diff and merge file comparator
description : |
    Tool to visualize changes between two versions of a file.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Codecs)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6JobWidgets)
    - cmake(KF6Parts)
    - cmake(KF6TextEditor)
    - cmake(KF6WidgetsAddons)
    - cmake(KompareDiff2)
    - cmake(Qt6PrintSupport)
rundeps     :
    - qt6-wayland
setup       : |
    %patch %(pkgdir)/0001-Fix-clipped-text-in-diff-view.patch

    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
