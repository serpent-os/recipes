name        : kf6-kirigami-app-components
version     : "1.1.1"
release     : 1
upstreams   :
    - https://download.kde.org/stable/kirigami-app-components/kirigami-app-components-1.1.1.tar.xz : f68f4d082933213d82b805217f2fa0690f51df7d00214ddb873812a60a6b830b
homepage    : https://invent.kde.org/libraries/kirigami-app-components
license     :
    - BSD-3-Clause
    - CC0-1.0
    - FSFAP
    - LGPL-2.0-or-later
    - LGPL-2.1
summary     : Kirigami addons and modules necessary to do a full featured KDE application
description : |
    Kirigami addons and modules necessary to do a full featured KDE application, such as an action collection with configurable keyboard shortcuts and standard actions.
builddeps   :
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6KirigamiPlatform)
    - cmake(Qt6Quick)
    - cmake(Qt6QuickControls2)
    - cmake(Qt6Widgets)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
