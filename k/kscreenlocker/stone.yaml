name        : kscreenlocker
version     : "6.8.0"
release     : 30
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.0/kscreenlocker-6.8.0.tar.xz : aec2b4e741d8b6a69853fb1cb0efd6a0e9f4d2a0eb14f23712918096a06def4f
homepage    : https://kde.org/plasma-desktop/
license     : GPL-2.0-or-later
summary     : Library and components for secure lock screen architecture
description : |
    Library and components for secure lock screen architecture
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Crash)
    - cmake(KF6GlobalAccel)
    - cmake(KF6I18n)
    - cmake(KF6IdleTime)
    - cmake(KF6KCMUtils)
    - cmake(KF6KIO)
    - cmake(KF6Notifications)
    - cmake(KF6Package)
    - cmake(KF6Screen)
    - cmake(KF6Solid)
    - cmake(KF6Svg)
    - cmake(KF6WindowSystem)
    - cmake(KF6XmlGui)
    - cmake(LayerShellQt)
    - cmake(PlasmaQuick)
    - cmake(Qt6Core)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6Qml)
    - cmake(Qt6Quick)
    - pkgconfig(pam)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        paths:
            - /usr/share/dbus-1/interfaces
