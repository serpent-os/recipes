name        : kdecoration
version     : "6.8.0"
release     : 26
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.0/kdecoration-6.8.0.tar.xz : 39d46c495e094ef70cbcd2f51fadaf5d96fae7c35f3da63f31c638a43912cf78
