name        : kde-inotify-survey
version     : "26.08.2"
release     : 1
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/kde-inotify-survey-26.08.2.tar.xz : f20daceb85f945ea8ffe33b6e32eeab260da80fa79332cc99bae7a5a47ae6741
homepage    : https://invent.kde.org/system/kde-inotify-survey
license     :
    - BSD-3-Clause
    - CC0-1.0
    - FSFAP
    - GPL-2.0-only
    - GPL-3.0-only
summary     : Monitor inotify limits
description : |
    Tooling for monitoring inotify limits and informing the user when they have been or are about to be reached.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Auth)
    - cmake(KF6CoreAddons)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6Notifications)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
