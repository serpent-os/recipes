name        : ksystemlog
version     : "26.08.2"
release     : 2
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/ksystemlog-26.08.2.tar.xz : 165f6b26e5cbaab13f85b7d3dc4a0d34d840018fd2e01ed6f17aa38ab8b8406b
homepage    : https://apps.kde.org/ksystemlog/
license     :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
summary     : System log viewer
description : |
    KSystemLog is a system log viewer for KDE. It displays the logs of the system, grouped by category (system, authentication, kernel, X.org, ...) and by optional services such as Apache and CUPS.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6Completion)
    - cmake(KF6Config)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6ItemViews)
    - cmake(KF6KIO)
    - cmake(KF6TextWidgets)
    - cmake(KF6WidgetsAddons)
    - cmake(KF6XmlGui)
    - pkgconfig(audit)
    - pkgconfig(libsystemd)
rundeps     :
    - qt6-wayland
setup       : |
    %cmake_kf6 \
        -DBUILD_TESTING=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    env QT_QPA_PLATFORM=offscreen %cmake_test
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
