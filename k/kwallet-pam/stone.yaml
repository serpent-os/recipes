name        : kwallet-pam
version     : "6.8.1"
release     : 25
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.1/kwallet-pam-6.8.1.tar.xz : 89f8233c9d2d9793c146cac2b5ec7de38ab5e3376b908f9c0dd70cbe70ac2217
homepage    : https://kde.org/plasma-desktop/
license     : LGPL-2.1-only
summary     : KWallet PAM integration
description : |
    KWallet PAM integration
builddeps   :
    - binary(socat)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Wallet)
    - pkgconfig(libgcrypt)
    - pkgconfig(pam)
rundeps     :
    - binary(socat)
    # Doesn't make any sense to have it without the kwallet service
    - kf6-kwallet
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
