name        : cosmic-term
version     : "1.11.0"
release     : 57
homepage    : https://github.com/pop-os/cosmic-term
upstreams   :
    - https://github.com/pop-os/cosmic-term/archive/refs/tags/epoch-1.11.0.tar.gz : 455cdc42e8f4a5a00a033a38f65341bf1b1af621cc7d01a78da0ee2f9177a09c
summary     : Cosmic Desktop Terminal Application
description : |
    Cosmic desktop Terminal Application
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps:
    - cosmic-icons
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
