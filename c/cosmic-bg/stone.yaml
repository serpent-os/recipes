name        : cosmic-bg
version     : "1.11.0"
release     : 54
homepage    : https://github.com/pop-os/cosmic-bg
summary     : Cosmic Desktop Background Service
upstreams   :
    - https://github.com/pop-os/cosmic-bg/archive/refs/tags/epoch-1.11.0.tar.gz :  00e0874b82877378be9cb305139e626f3cd5ef01ad7a1a517de826086adc2652
description : |
    Cosmic Desktop Background Service
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(dav1d)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %patch %(pkgdir)/aerynos_branding.patch
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
