name        : cosmic-launcher
version     : "1.11.0"
release     : 54
homepage    : https://github.com/pop-os/cosmic-launcher
upstreams   :
    - https://github.com/pop-os/cosmic-launcher/archive/refs/tags/epoch-1.11.0.tar.gz : 82a510d7d472c68cdd1137363704c1f6a91b37de4f48e5a1f844242de79f941d
summary     : Cosmic Desktop Launcher
description : |
    Cosmic Desktop Launcher
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(pop-launcher)
networking  : true
setup       : |
    # Install shipped desktop/metainfo from data/, and use share/metainfo
    %patch %(pkgdir)/Install-metainfo-to-share-metainfo.patch

    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
