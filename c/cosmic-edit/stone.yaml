name        : cosmic-edit
version     : "1.11.0"
release     : 58
homepage    : https://github.com/pop-os/cosmic-edit
upstreams   :
    - https://github.com/pop-os/cosmic-edit/archive/refs/tags/epoch-1.11.0.tar.gz : aff1a305a4e7182ae1c360ceac43eff60ba32dc388f872f3ec04624677a6a290
summary     : Cosmic Desktop Text Editor
description : |
    Cosmic desktop Text Editor
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(glib-2.0)
    - pkgconfig(xkbcommon)
rundeps     :
    - cosmic-icons
    - gvfs # Used for file services
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
