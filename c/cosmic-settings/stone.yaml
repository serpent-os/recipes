name        : cosmic-settings
version     : "1.11.0"
release     : 62
homepage    : https://github.com/pop-os/cosmic-settings
upstreams   :
    - https://github.com/pop-os/cosmic-settings/archive/refs/tags/epoch-1.11.0.tar.gz : 213459e770dc899da7f9d47557b7d3e4e27e1debb8d7af590995bd0f63da0a5e
summary     : Cosmic Desktop Settings
description : |
    Cosmic Desktop Settings
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dav1d)
    - pkgconfig(libinput)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(nm-connection-editor)
    - binary(pipewire-pulse)
    - cosmic-icons
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
