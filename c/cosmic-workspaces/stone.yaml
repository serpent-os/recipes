name        : cosmic-workspaces
version     : "1.11.0"
release     : 52
homepage    : https://github.com/pop-os/cosmic-workspaces-epoch
upstreams   :
    - https://github.com/pop-os/cosmic-workspaces-epoch/archive/refs/tags/epoch-1.11.0.tar.gz : 4dad3cd1fffe5b377c84948598c666493e5a053e6e1105a958f20a73bea92eab
