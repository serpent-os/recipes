name        : cpx
version     : "0.2.1"
release     : 4
homepage    : https://github.com/11happy/cpx
upstreams   :
    - https://github.com/11happy/cpx/archive/refs/tags/v0.2.1.tar.gz : 3f2aa3a4ef8ab86239671eeadded9b9b2f942ab448842e2170e63f870ee5c2d0
summary     : cp reimagined
description : |
    cpx is a modern replacement for the traditional cp command, built with Rust for maximum performance and safety on Linux systems.
license     : MIT
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
check       : |
    # test is expected to fail but succeeds due to root, skip it
    %cargo_test -- --skip test_no_config_flag
