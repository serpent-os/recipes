name        : cosmic-osk
version     : "1.11.0"
release     : 3
homepage    : https://github.com/pop-os/cosmic-osk
upstreams   :
    - https://github.com/pop-os/cosmic-osk/archive/refs/tags/epoch-1.11.0.tar.gz : bdb94386f451e672c2512ddb65bd0c8691921d5488595d0988fd935ce7e43bb6
summary     : Cosmic On-Screen Keyboard
description : |
    Cosmic On-Screen Keyboard
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
