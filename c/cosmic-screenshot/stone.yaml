name        : cosmic-screenshot
version     : "1.11.0"
release     : 53
homepage    : https://github.com/pop-os/cosmic-screenshot
upstreams   :
    - https://github.com/pop-os/cosmic-screenshot/archive/refs/tags/epoch-1.11.0.tar.gz : 0bf658bda69ce67113d58d1ad5d32126218095194cc51f69c27b8d6399962af7
summary     : Cosmic Screenshot Tool
description : |
    Cosmic Screenshot Tool
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps:
    - cosmic-icons
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
