name        : c-ares
version     : "1.34.9"
release     : 6
homepage    : https://c-ares.org/
upstreams   :
    - https://github.com/c-ares/c-ares/releases/download/v1.34.9/c-ares-1.34.9.tar.gz : 9364b70a12eb59a06830fb488d9357f90100dff0d98b23ea3593a183d43e6f2f
summary     : C library that performs DNS requests and name resolves asynchronously
description : |
    This is c-ares, an asynchronous resolver library. It is intended for applications which need to perform DNS queries without blocking, or need to perform multiple DNS queries in parallel. The primary examples of such applications are servers which communicate with multiple clients and programs with graphical user interfaces.
license     : MIT
checkdeps   :
    - cmake(GTest)
    - sysbinary(ip)
setup       : |
    %cmake \
        -DCARES_BUILD_TESTS:BOOL=ON \
        -DCARES_BUILD_TOOLS:BOOL=OFF
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    export PATH="$PATH:/usr/sbin"
    # dummy for SockStateDeliveryTest
    ip link add cares0 type dummy
    ip addr add 192.0.2.1/24 dev cares0
    ip link set cares0 up

    # DefaultChannelTest.Live* passes with networking
    GTEST_FILTER="-DefaultChannelTest.Live*" %cmake_test
