name        : cosmic-app-library
version     : "1.11.0"
release     : 2
homepage    : https://github.com/pop-os/cosmic-app-library
upstreams   :
    - https://github.com/pop-os/cosmic-app-library/archive/refs/tags/epoch-1.11.0.tar.gz : 9ce3f012af1f885b0a99c589e77803c8d7fb76cba7a7202030cae19f1ac2dd55
summary     : Cosmic Desktop App Launcher
description : |
    Cosmic Desktop App Launcher
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dbus-1)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
networking  : true
setup       : |
    # Install shipped desktop/metainfo from data/, and use share/metainfo
    %patch %(pkgdir)/Install-static-desktop-and-metainfo-files.patch

    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
