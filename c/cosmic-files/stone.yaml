name        : cosmic-files
version     : "1.11.0"
release     : 61
homepage    : https://github.com/pop-os/cosmic-files
upstreams   :
    - https://github.com/pop-os/cosmic-files/archive/refs/tags/epoch-1.11.0.tar.gz : ceeea09a6e249192a8e439d416f20391e923cb75c09922297ff9e6b9926e8eb7
summary     : Cosmic Desktop File Browser
description : |
    Cosmic desktop File Browser
license     : GPL-3.0
builddeps   :
    - binary(just)
    - binary(which)
    - pkgconfig(bzip2)
    - pkgconfig(glib-2.0)
    - pkgconfig(liblzma)
    - pkgconfig(libzstd)
    - pkgconfig(xkbcommon)
rundeps     :
    - cosmic-icons
    # Used for file services
    - gvfs-fuse
    - gvfs-mtp
    - gvfs-nfs
    - gvfs-smb
networking  : true
environment : |
    # Force system libs
    export ZSTD_SYS_USE_PKG_CONFIG=1
setup       : |
    %cargo_fetch
build       : |
    %cargo_build -p cosmic-files
    %cargo_build -p cosmic-files-applet
    %cargo_build -p cosmic-files-thumbnailer
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
