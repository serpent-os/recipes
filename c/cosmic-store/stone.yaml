name        : cosmic-store
version     : "1.11.0"
release     : 53
homepage    : https://github.com/pop-os/cosmic-store
upstreams   :
    - https://github.com/pop-os/cosmic-store/archive/refs/tags/epoch-1.11.0.tar.gz : d8c95307e4a865ab4681a0be86fea98f82fb052ecc7bcea98fad2b8165c34e83
summary     : Cosmic Desktop Store
description : |
    Cosmic Desktop Store
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(dbus-1)
    - pkgconfig(flatpak)
    - pkgconfig(glib-2.0)
    - pkgconfig(libinput)
    - pkgconfig(libssl)
    - pkgconfig(libudev)
    - pkgconfig(xkbcommon)
rundeps   :
    - cosmic-icons
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build --features wgpu,flatpak,logind
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
