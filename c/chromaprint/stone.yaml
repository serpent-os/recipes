name        : chromaprint
version     : "1.6.2"
release     : 4
upstreams   :
    - https://github.com/acoustid/chromaprint/releases/download/v1.6.2/chromaprint-1.6.2.tar.gz : d54ada62c16b2db396d3251ec54fc7a58909c163131a1cfcf7fa6407dbc14360
homepage    : https://acoustid.org/chromaprint
license     : LGPL-2.1-or-later
summary     : Library for extracting fingerprints from any audio source
description : |
    Library for extracting fingerprints from any audio source
builddeps   :
    - pkgconfig(fftw3)
    - pkgconfig(libavcodec)
    - pkgconfig(libavdevice)
    - pkgconfig(libavformat)
    - pkgconfig(libavutil)
    - pkgconfig(libswresample)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
