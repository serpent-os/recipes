name        : cosmic-panel
version     : "1.11.0"
release     : 54
homepage    : https://github.com/pop-os/cosmic-panel
upstreams   :
    - https://github.com/pop-os/cosmic-panel/archive/refs/tags/epoch-1.11.0.tar.gz : ef0de256580e1f1600c5a662179862976ba0b8475b45e99e9eb2713bed8e1007
summary     : Cosmic Desktop Panel
description : |
    Cosmic Desktop panel
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(cosmic-applets)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    RUST_BACKTRACE=1 %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
