name        : jemalloc
version     : "5.4.0"
release     : 7
upstreams   :
    - https://github.com/jemalloc/jemalloc/releases/download/5.4.0/jemalloc-5.4.0.tar.bz2: 200776fac271093e7c2f21edd6d62657ecd2be578d9328633f2a86bfa6ef4f1d
homepage    : https://jemalloc.net/
license     : BSD-2-Clause
summary     : jemalloc is a general purpose malloc(3) implementation that emphasizes fragmentation avoidance and scalable concurrency support.
description : |
    jemalloc is a general purpose malloc(3) implementation that emphasizes fragmentation avoidance and scalable concurrency support.
builddeps   :
    - binary(xsltproc)
setup       : |
    # Note: We need static libjemalloc for rust
    %configure \
        --disable-fill
build       : |
    %make
install     : |
    %make_install
tuning      :
    - icf: all
    - lto: full
    - nosemantic
    - symbolic
packages    :
    - "%(name)-libs":
        summary: Libraries for jemalloc
        description: |
            Libraries for jemalloc
        paths:
            - /usr/lib/lib*.so.*
    - "%(name)":
        rundeps:
            - "%(name)-libs"
            - binary(perl)
    - "%(name)-devel":
        paths:
            - /usr/bin/jemalloc-config
