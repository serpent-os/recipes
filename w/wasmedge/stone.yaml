name        : wasmedge
version     : "0.18.1"
release     : 4
upstreams   :
    - https://github.com/WasmEdge/WasmEdge/releases/download/0.18.1/WasmEdge-0.18.1-src.tar.gz : 589031c828628fbae8576e9d6ef497ac9888bca964dacacaa79ad9c82f9538bc
homepage    : https://wasmedge.org/
license     : Apache-2.0 AND CC0-1.0
summary     : High performance WebAssembly Virtual Machine
description : |
    High performance WebAssembly Virtual Machine
builddeps   :
    - binary(llvm-config-23)
    - cmake(LLVM)
    - cmake(blake3)
    - pkgconfig(fmt)
