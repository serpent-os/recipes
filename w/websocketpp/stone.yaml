name        : websocketpp
version     : "0.8.2"
release     : 1
homepage    : https://github.com/zaphoyd/websocketpp
upstreams   :
    - https://github.com/zaphoyd/websocketpp/archive/refs/tags/0.8.2.tar.gz : 6ce889d85ecdc2d8fa07408d6787e7352510750daa66b5ad44aacb47bea76755
summary     : C++ websocket client/server library
description : |
    WebSocket++ is a header only C++ library that implements RFC6455 The WebSocket Protocol. It allows integrating WebSocket client and server functionality into C++ programs. It uses interchangeable network transport modules including one based on raw char buffers, one based on C++ iostreams, and one based on Asio (either via Boost or standalone). End users can write additional transport policies to support other networking or event libraries as needed.
license     : BSD-3-Clause
builddeps   :
    - cmake(Boost)
    - cmake(OpenSSL)
    - cmake(zlib)
setup       : |
    # Update minimum required CMake version
    # https://github.com/zaphoyd/websocketpp/pull/1168
    # TODO: Remove in next update
    %patch %(pkgdir)/1168.patch

    # Fix clang compiler flags
    # https://github.com/zaphoyd/websocketpp/pull/859
    # TODO: Remove in next update(?)
    %patch %(pkgdir)/859.patch

    # From Arch
    %patch %(pkgdir)/websocketpp-0.8.2-boost-1.87-compat.patch

    %cmake \
        -DBUILD_TESTS=ON
build       : |
    %cmake_build
install     : |
    %cmake_install

    # delete test binaries
    rm -rv %(installroot)%(bindir)
check       : |
    # Test failure https://github.com/zaphoyd/websocketpp/issues/639
    %cmake_test -E test_transport_asio_timers
packages    :
    # Headers only package
    - "%(name)" :
        paths :
            - /*
