name        : openh264
version     : "2.7.0"
release     : 4
upstreams   :
    - https://github.com/cisco/openh264/archive/refs/tags/v2.7.0.tar.gz : 5178775c8b440073e70920e97d195efff721c0e56d0a78cc82c919e95d54924d
homepage    : https://www.openh264.org/
license     : BSD-2-Clause
summary     : H.264 codec library
description : |
    OpenH264 is a codec library which supports H.264 encoding and decoding. It is
    suitable for use in real time applications such as WebRTC.
builddeps   :
    - binary(nasm)
build       : |
    %make
install     : |
    %make_install PREFIX="%(prefix)"

    rm -v %(installroot)%(libdir)/lib*.a
