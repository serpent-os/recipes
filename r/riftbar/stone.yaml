name        : riftbar
version     : "0.2.8"
release     : 5
homepage    : https://codeberg.org/sorashii/riftbar
upstreams   :
    - https://codeberg.org/sorashii/riftbar/archive/v0.2.8.tar.gz : c91df19130815e1a44ec762b441eb54e39606f9c845205d452529aa1fbc88ff1
summary     : Highly customizable GTK4 bar for Wayland written in Rust.
description : |
    Riftbar is a Waybar-like status bar writen in Rust designed to be fast, safe and modern.
license     : GPL-3.0-or-later
builddeps   :
    - pkgconfig(cairo)
    - pkgconfig(cairo-gobject)
    - pkgconfig(dbus-1)
    - pkgconfig(gdk-pixbuf-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(graphene-gobject-1.0)
    - pkgconfig(gtk4)
    - pkgconfig(gtk4-layer-shell-0)
    - pkgconfig(pango)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
