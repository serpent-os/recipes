name        : python-pycparser
version     : "3.12"
release     : 8
homepage    : https://github.com/eliben/pycparser
upstreams   :
    - https://pypi.debian.net/pycparser/pycparser-3.12.tar.gz : f03387877eab82ce01bbdfd0ba7252ee55a90b1c708d5129e2ce915475cf1db6
summary     : C parser and AST generator written in Python
description : |
    C parser and AST generator written in Python
license     : BSD-3-Clause
builddeps   :
    - python(setuptools)
rundeps     :
    - python-libs
checkdeps   :
    - binary(clang-cpp)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
check       : |
    python -m unittest discover
