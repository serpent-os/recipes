name        : pnpm
version     : "12.12.1"
release     : 10
homepage    : https://pnpm.io
upstreams   :
    - https://github.com/pnpm/pnpm/archive/refs/tags/v12.12.1.tar.gz : eb5bce64814aa741288a39ca2079624010e75601d4509325d9c482f151651c67
    # Frozen node-gyp tree from the same release; the binary looks for dist/ beside itself
    - https://github.com/pnpm/pnpm/releases/download/v12.12.1/pnpm-linux-x64.tar.gz:
        hash: f61657f53f7891f76ae5cf11e924ee3e9ae1659affcaf7deb9622d4d7ea5637e
        unpack: false
        rename: pnpm-linux-x64.tar.gz
summary     : Fast, disk space efficient package manager
description : |
    Fast, disk space efficient package manager
license     : MIT
networking  : true
builddeps   :
    - binary(node)
rundeps     :
    - binary(make)
    - binary(node)
    - binary(python)
setup       : |
    %cargo_fetch

    # deps-restorer embeds a bundle generated from the ESM loader; generate it
    # with the pnpm binary shipped in the release tarball before the cargo build.
    mkdir -p .bootstrap
    bsdtar-static -xf %(sourcedir)/pnpm-linux-x64.tar.gz -C .bootstrap pnpm dist
    .bootstrap/pnpm install \
        --frozen-lockfile \
        --filter @pnpm/esm-loader \
        --ignore-scripts
    node pnpm/esm-loader/scripts/bundle-runtime.mjs
build       : |
    %cargo_build -p pnpm-cli --bin pnpm
install     : |
    %install_dir %(installroot){%(bindir),%(libdir)/pnpm}
    %install_exe %(cargo_target_dir)/pnpm %(installroot)%(libdir)/pnpm/pnpm
    ln -srv %(installroot)%(libdir)/pnpm/pnpm %(installroot)%(bindir)/pnpm
    bsdtar-static -xf %(sourcedir)/pnpm-linux-x64.tar.gz -C %(installroot)%(libdir)/pnpm dist

    # Aliases upstream ships next to the binary in its npm package
    %install_bin pnpm/npm/pnpm/{pn,pnpx,pnx}

    %(cargo_target_dir)/pnpm completion bash | %install_file /dev/stdin %(installroot)%(bashcompletionsdir)/pnpm
    %(cargo_target_dir)/pnpm completion fish | %install_file /dev/stdin %(installroot)%(fishcompletionsdir)/pnpm.fish
    %(cargo_target_dir)/pnpm completion zsh | %install_file /dev/stdin %(installroot)%(zshcompletionsdir)/_pnpm
