name        : plasma-activities-stats
version     : "6.8.0"
release     : 24
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.0/plasma-activities-stats-6.8.0.tar.xz : 6ab189046d9bbe44c4c8a4bb7eaf2f9593c0c692aa17d0e3e8207a7f658ced6c
homepage    : https://kde.org/plasma-desktop/
license     :
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
summary     : library for accessing the usage data collected by the activities system
description : |
    library for accessing the usage data collected by the activities system
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(PlasmaActivities)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
