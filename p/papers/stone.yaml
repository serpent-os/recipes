name        : papers
version     : "51.1"
release     : 22
homepage    : https://apps.gnome.org/Papers/
upstreams   :
    - https://download.gnome.org/sources/papers/51/papers-51.1.tar.xz : ac0db229883b3d2aacbbda1700dc12aa69716664df201120926096f066e4796b
summary     : Read documents
description : |
    A document viewer for the GNOME desktop. You can view, search or annotate documents in many different formats.
    Papers supports documents in: PDF, PS, EPS, XPS, DjVu, TIFF, and Comic Books archives (CBR, CBT, CBZ, CB7).
license     : GPL-2.0-or-later
networking  : true
builddeps   :
    - binary(appstreamcli)
    - binary(blueprint-compiler)
    - binary(cargo)
    - binary(gi-docgen)
    - binary(itstool)
    - binary(msgfmt)
    - binary(update-desktop-database)
    - pkgconfig(cairo)
    - pkgconfig(ddjvuapi)
    - pkgconfig(exempi-2.0)
    - pkgconfig(gdk-pixbuf-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gmodule-2.0)
    - pkgconfig(gobject-introspection-1.0)
    - pkgconfig(gthread-2.0)
    - pkgconfig(gtk4-unix-print)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libarchive)
    # pkgconfig(libgxps)
    - pkgconfig(libnautilus-extension-4)
    - pkgconfig(libspectre)
    - pkgconfig(libspelling-1)
    - pkgconfig(libtiff-4)
    - pkgconfig(poppler-glib)
    - pkgconfig(sysprof-capture-4)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
check       : |
    %meson_test
packages    :
    # TODO: Split out nautilus extension once we have conditional deps
    - "%(name)-libs":
        summary: "Library files for %(name)"
        description: |
            Library files for %(name), typically pulled in as a dependency of another package.
        paths:
            - /usr/lib/girepository-1.0/*.typelib
            - /usr/lib/libppsdocument-4.0.so.*
            - /usr/lib/libppsview-4.0.so.*
            - /usr/lib/papers/*/backends/lib*.so
            - /usr/lib/papers/*/backends/*.papers-backend
            - /usr/share/metainfo/*Document.metainfo.xml
