name        : plasma-workspace-wallpapers
version     : "6.8.1"
release     : 24
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.1/plasma-workspace-wallpapers-6.8.1.tar.xz : a9ae389b12c5b9cb44fdb405b13c3a2acb458879c23343e6caf50a22def02bb0
