name        : plasma-workspace-wallpapers
version     : "6.8.0"
release     : 23
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.0/plasma-workspace-wallpapers-6.8.0.tar.xz : 1c0902504d1c27ab86cac5aa354ebe3c2797e4430200511d83ff1ed3111ce663
