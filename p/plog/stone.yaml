name        : plog
version     : "1.1.11"
release     : 1
homepage    : https://github.com/SergiusTheBest/plog
upstreams   :
    - https://github.com/SergiusTheBest/plog/archive/refs/tags/1.1.11.tar.gz : d60b8b35f56c7c852b7f00f58cbe9c1c2e9e59566c5b200512d0cdbb6309a7c2
summary     : Portable, simple and extensible C++ logging library
description : |
    Plog is a C++ logging library that is designed to be as simple, small and flexible as possible.
    It is created as an alternative to existing large libraries and provides some unique features as CSV log format and wide string support.
license     : MIT
setup       : |
    %patch %(pkgdir)/fix-test-build-with-CMake-4.patch
    %cmake \
        -DPLOG_BUILD_SAMPLES=OFF \
        -DPLOG_BUILD_TESTS=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    %cmake_test
packages    :
    # dev only package
    - "%(name)":
        paths:
            - /usr/include/
            - /usr/lib/cmake
