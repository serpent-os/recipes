name        : pkgconf
version     : "3.0.9"
release     : 17
summary     : Package compiler and linker metadata toolkit
license     : ISC
homepage    : https://gitea.treehouse.systems/ariadne/pkgconf
description : |
    Package compiler and linker metadata toolkit
upstreams   :
    - https://distfiles.ariadne.space/pkgconf/pkgconf-3.0.9.tar.gz: 642700ab125e6dcb3ceb822469420b0132c26f5585dec88cbe6057134525e57d
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
    ln -sf pkgconf %(installroot)/usr/bin/pkg-config
packages    :
    - "%(name)":
        paths:
            - /usr/share/aclocal/pkg.m4
