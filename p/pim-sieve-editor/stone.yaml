name        : pim-sieve-editor
version     : "26.08.2"
release     : 1
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/pim-sieve-editor-26.08.2.tar.xz : f7f24d4c0496ee4565abc6821a3b353f7d6b7d5994f247820427243ecafd551c
homepage    : https://invent.kde.org/pim/pim-sieve-editor
license     :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
    - MIT
summary     : Editor for IMAP Sieve mail filters
description : |
    An application to assist with editing IMAP Sieve filters, which sort incoming mail on the server.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KDSingleApplication-qt6)
    - cmake(KF6Bookmarks)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6KIO)
    - cmake(KF6TextAddonsWidgets)
    - cmake(KF6TextAutoGenerateText)
    - cmake(KF6UserFeedback)
    - cmake(KF6WindowSystem)
    - cmake(KF6XmlGui)
    - cmake(KPim6IMAP)
    - cmake(KPim6KSieveUi)
    - cmake(KPim6MailTransport)
    - cmake(KPim6PimCommon)
    - cmake(Qt6GuiPrivate)
    - cmake(Qt6Keychain)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
