name        : python-platformdirs
version     : "4.13.0"
release     : 11
homepage    : https://github.com/tox-dev/platformdirs
upstreams   :
    - https://pypi.debian.net/platformdirs/platformdirs-4.13.0.tar.gz : 1aa0b0d3f224c1f07c295121e312a5a24a180d6ae5a8425ea1784b3e3863e9c0
summary     : A library to determine platform-specific system directories
description : |
    A library to determine platform-specific system directories
license     : MIT
builddeps   :
    - python(hatch-vcs)
    - python(hatchling)
rundeps     :
    - binary(python3)
checkdeps   :
    - python(appdirs)
    - python(pytest)
    - python(pytest-mock)
build       : |
    %pyproject_build
install     : |
    %pyproject_install
check       : |
    # TODO replace with pytest macro
    # tests/test_pytest_plugin.py needs the plugin's pytest11 entry point, which
    # isn't registered when testing straight from the source tree.
    PYTHONPATH="$PWD"/src PYTEST_PLUGINS=platformdirs.pytest_plugin pytest
