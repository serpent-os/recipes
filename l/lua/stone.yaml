name        : lua
version     : "5.5.1"
release     : 13
homepage    : https://www.lua.org
upstreams   :
    - https://www.lua.org/ftp/lua-5.5.1.tar.gz : 1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce
    - https://www.lua.org/tests/lua-5.5.1-tests.tar.gz : da07b543872dc0bb2ff12aabd0c248578d78df3eb6b67efdc537a46d455c7f31
summary     : Lightweight and embeddable language
description : |
    Lua is a powerful, efficient, lightweight, embeddable scripting language. It supports procedural programming, object-oriented programming, functional programming, data-driven programming, and data description.

    Lua combines simple procedural syntax with powerful data description constructs based on associative arrays and extensible semantics. Lua is dynamically typed, runs by interpreting bytecode with a register-based virtual machine, and has automatic memory management with incremental garbage collection, making it ideal for configuration, scripting, and rapid prototyping.
license     : MIT
builddeps   :
    - pkgconfig(mimalloc)
    - pkgconfig(readline)
checkdeps   :
    - binary(grep)
    - binary(readelf)
tuning      :
    - lto: full
    - optimize: speed
environment : |
    _ver="%(version)"
    _major_ver=${_ver%.*}

    export CFLAGS="${CFLAGS} -mllvm -vp-counters-per-site=20"
setup       : |
    mkdir src/tests
    bsdtar-static -xf %(sourcedir)/lua-%(version)-tests.tar.gz -C %(workdir)/src/tests --strip-components=1

    %patch %(pkgdir)/aeryn/soname.patch
build       : |
    %make linux-readline \
        CC="$CC" \
        CFLAGS="$CFLAGS -DLUA_USE_LINUX -fPIC" \
        LDFLAGS="$LDFLAGS" \
        AR="$AR rcu" \
        RANLIB="$RANLIB" \
        MYLIBS="-lmimalloc"
install     : |
    _version_major_minor=$(echo %(version) | cut -d. -f1-2)

    %make_install \
        TO_LIB="liblua.so liblua.so.$_major_ver liblua.so.$_ver" \
        INSTALL_TOP=%(installroot)/usr \
        INSTALL_BIN=%(installroot)/%(bindir) \
        INSTALL_INC=%(installroot)/%(includedir) \
        INSTALL_LIB=%(installroot)/%(libdir) \
        INSTALL_MAN=%(installroot)/%(mandir)

    cp %(pkgdir)/lua.pc.in ./lua.pc
    sed -e "s|@V@|${_version_major_minor}|g" \
        -e "s|@R@|%(version)|g" \
        -i ./lua.pc
    %install_file ./lua.pc %(installroot)%(libdir)/pkgconfig/lua-${_version_major_minor}.pc
    ln -s lua-${_version_major_minor}.pc %(installroot)%(libdir)/pkgconfig/lua.pc

    mv %(installroot)%(libdir)/liblua.so %(installroot)%(libdir)/liblua.so.%(version)
    ln -sf liblua.so.%(version) %(installroot)%(libdir)/liblua.so.$_major_ver
    ln -s liblua.so.%(version) %(installroot)%(libdir)/liblua.so
check       : |
    # Make sure that liblua doesn't end up getting linked against libmimalloc by mistake
    ! (readelf -d %(installroot)%(libdir)/liblua.so.%(version) | grep -q "libmimalloc") || exit 1
workload    : |
    # avoid OOM running heavy.lua test
    ulimit -v $((1024 * 1024 * 8))

    cd src/tests/libs
    %make
    cd ..
    # all.lua doesn't keep going on failure, we want to maximize profile coverage
    for f in *.lua; do
        echo "===== $f ====="
        ../lua "$f" || echo "FAIL: $f"
    done
cspgo       : true
packages    :
    - "%(name)-libs":
        summary: "Library files for %(name)"
        description: |
            Library files for %(name), typically pulled in as a dependency of another package.
        paths:
            - /usr/lib/liblua.so.*

    # Moss upgrade bug
    - "%(name)":
        rundeps:
            - "%(name)-libs"

    - "%(name)-staticlib":
        summary: Static libs for %(name)
        description: Static libs for %(name)
        paths:
            - /usr/lib/lib*.a
        rundeps:
            - "%(name)-devel"
