name        : lmdb
version     : "1.0.2"
release     : 16
homepage    : https://www.symas.com/lmdb
upstreams   :
    - https://git.openldap.org/openldap/openldap/-/archive/LMDB_1.0.2/openldap-LMDB_1.0.2.tar.gz : 38a029bb3e29820380e18a2dfdbe906bbc5b322132c63274c5e4ed7833821752

    - https://git.openldap.org/openldap/openldap/-/archive/LMDB_0.9.36/openldap-LMDB_0.9.36.tar.gz :
        hash: 90a595ea500074af61b213464452d8d212405261094667a686357467ae7b57b9
        unpackdir: compat
summary     : Symas Lightning Memory-Mapped Database
description : |
    Symas Lightning Memory-Mapped Database
license     : OLDAP-2.8
setup       : |
    %patch %(pkgdir)/lmdb-1.0-shared-tools.patch

    if [ -d ../compat ]; then
        pushd ../compat
        %patch %(pkgdir)/lmdb-0.9-soname.patch
        popd
    fi
build       : |
    # LMDB 1.0 hardcodes LDFLAGS in its Makefile, hiding the distro link flags
    %make -C libraries/liblmdb \
        AR=%(ar) \
        CC=%(cc) \
        LDFLAGS="${LDFLAGS}" \
        XCFLAGS="${CFLAGS}"

    if [ -d ../compat ]; then
        %make -C ../compat/libraries/liblmdb \
            AR=%(ar) \
            CC=%(cc) \
            XCFLAGS="${CFLAGS}"
    fi
install     : |
    %make_install -C libraries/liblmdb \
        AR=%(ar) \
        CC=%(cc) \
        LDFLAGS="${LDFLAGS}" \
        XCFLAGS="${CFLAGS}" \
        libdir=%(libdir) \
        prefix=%(prefix)

    # We do not ship static libraries
    rm -v %(installroot)%(libdir)/liblmdb.a

    # Upstream generates, but does not install, a pkg-config file
    cp %(pkgdir)/lmdb.pc.in ./lmdb.pc
    sed -e 's|@PKGVER@|%(version)|g' -i ./lmdb.pc
    %install_file ./lmdb.pc %(installroot)%(libdir)/pkgconfig/lmdb.pc

    if [ -d ../compat ]; then
        pushd ../compat/libraries/liblmdb
        %install_exe liblmdb.so.0.0.0 %(installroot)%(libdir)/liblmdb.so.0.0.0
        for prog in mdb_copy mdb_dump mdb_load mdb_stat; do
            %install_exe ${prog} %(installroot)%(bindir)/${prog}-0.9
            %install_file ${prog}.1 %(installroot)%(mandir)/man1/${prog}-0.9.1
        done
        popd
    fi
check       : |
    pushd libraries/liblmdb
    export LD_LIBRARY_PATH="."
    %make AR=%(ar) CC=%(cc) XCFLAGS="${CFLAGS}" test
    popd

    if [ -d ../compat ]; then
        pushd ../compat/libraries/liblmdb
        %make AR=%(ar) CC=%(cc) XCFLAGS="${CFLAGS}" test
        popd
    fi
tuning      :
    - optimize: speed
packages    :
    - "%(name)-libs":
        paths:
            - /usr/lib/liblmdb.so.*
