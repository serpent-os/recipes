name        : loupe
version     : "51.1"
release     : 20
homepage    : https://apps.gnome.org/Loupe/
upstreams   :
    - https://download.gnome.org/sources/loupe/51/loupe-51.1.tar.xz : a38907d01bb6e027aeb772d10bc6cc2f92fde54d2090f6352dca8e84606e7730
summary     : Image Viewer
description : |
    Browse through your images and inspect their metadata with:
    - Fast GPU accelerated image rendering
    - Tiled rendering for vector graphics
    - Extendable and sandboxed image decoding
    - Accessible presentation of the most important metadata.
license     :
    - GPL-3.0-or-later
networking  : true
builddeps   :
    - binary(appstreamcli)
    - binary(cargo)
    - binary(itstool)
    - binary(msgfmt)
    - binary(update-desktop-database)
    - pkgconfig(gtk4)
    - pkgconfig(gweather4)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libseccomp)
rundeps     :
    - glycin-loaders
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
check       : |
    %meson_test
