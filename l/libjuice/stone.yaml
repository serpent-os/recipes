name        : libjuice
version     : "1.7.4"
release     : 1
homepage    : https://github.com/paullouisageneau/libjuice
upstreams   :
    - https://github.com/paullouisageneau/libjuice/archive/refs/tags/v1.7.4.tar.gz : 95c088862aa1b88b73d62aa99577135010eb768fcafb252d13aa85a8515ef798
summary     : JUICE is a UDP Interactive Connectivity Establishment library
description : |
    libjuice (JUICE is a UDP Interactive Connectivity Establishment library) allows to open bidirectionnal User Datagram Protocol (UDP) streams with Network Address Translator (NAT) traversal.
license     : MPL-2.0
builddeps   :
    - pkgconfig(nettle)
checkdeps   :
    - sysbinary(ip)
setup       : |
    # this test requires stun.l.google.com:19302, skip it
    %patch %(pkgdir)/skip-gathering-test.patch

    %cmake \
        -DUSE_NETTLE=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
check       : |
    export PATH="$PATH:/usr/sbin"
    # provide a dummy interface for the tests to use.
    ip link add dtls0 type dummy
    ip addr add 192.0.2.1/24 dev dtls0
    ip link set dtls0 up

    %(builddir)/tests
