name        : libkscreen
version     : "6.8.0"
release     : 32
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.0/libkscreen-6.8.0.tar.xz : 09a30242ad027978333f4773ae6401f9a666c6dbf80fa25f74c8be2deaecb949
homepage    : https://kde.org/plasma-desktop/
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-only
summary     : KDE's screen management software
description : |
    KDE's screen management software
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(PlasmaWaylandProtocols)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6WaylandClient)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
