name        : libkscreen
version     : "6.8.1"
release     : 33
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.1/libkscreen-6.8.1.tar.xz : 081e39bc7fb7b0b894a71dc15897a2022ad0f8b78a8e1bec163cd566fa6712fb
homepage    : https://kde.org/plasma-desktop/
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-only
summary     : KDE's screen management software
description : |
    KDE's screen management software
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(PlasmaWaylandProtocols)
    - cmake(Qt6CorePrivate)
    - cmake(Qt6WaylandClient)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
