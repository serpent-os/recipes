name        : libxi
version     : "1.8.4"
release     : 8
homepage    : https://gitlab.freedesktop.org/xorg/lib/libxi
upstreams   :
    - https://www.x.org/releases/individual/lib/libXi-1.8.4.tar.gz : 4d52f03b693cf3b32ae21701310cce34344ec8535f50d1667b1510a7083eca4a
summary     : Xlib library for the X Input Extension
description : |
    Xlib library for the X Input Extension
license     : X11
builddeps   :
    - binary(asciidoc)
    # - binary(fop)
    - binary(xmlto)
    - binary(xsltproc)
    - pkgconfig(inputproto)
    - pkgconfig(xorg-macros)
    - pkgconfig32(x11)
    - pkgconfig32(xext)
    - pkgconfig32(xfixes)
emul32      : true
setup       : |
    %configure \
        --disable-static
build       : |
    %make
install     : |
    %make_install
