name        : libkmahjongg
version     : "26.08.2"
release     : 1
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/libkmahjongg-26.08.2.tar.xz : 5f5b592e54a3a2029307a3080ea98c9dad43f9ee45a356daf64965970eab91f1
homepage    : https://invent.kde.org/games/libkmahjongg
license     :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
summary     : Common code and assets for KMahjongg
description : |
    Library providing common code and assets for KMahjongg.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Config)
    - cmake(KF6ConfigWidgets)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6WidgetsAddons)
    - cmake(Qt6Svg)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    # KMahjongglib6Config.cmake find_dependency()s these, so consumers need them present
    - "%(name)-devel":
        rundeps:
            - cmake(KF6ConfigWidgets)
