name        : libtraceevent
version     : "1.9.1"
release     : 11
homepage    : https://git.kernel.org/pub/scm/libs/libtrace/libtraceevent.git/about/
upstreams   :
    - https://git.kernel.org/pub/scm/libs/libtrace/libtraceevent.git/snapshot/libtraceevent-1.9.1.tar.gz : 3bc19dd940914260ba591b5276723bf84bb43f82c7c3d4267622bee4d016ea55
summary     : Linux kernel trace event library
description : |
    The libtraceevent(3) library provides APIs to access kernel tracepoint events, located in the tracefs file system under the events directory.
license     :
    - GPL-2.0
    - LGPL-2.1
builddeps   :
    - binary(asciidoc)
    - binary(readelf)
    # - binary(xmlto)
    - pkgconfig(cunit)
    # Needs source-highlight for docs
setup       : |
    %meson \
        -Ddefault_library=shared \
        -Ddoc=false
build       : |
    %meson_build
install     : |
    %meson_install
check       : |
    # BTF tests fail on build server presumably due to missing permissions
    %meson_test || :
