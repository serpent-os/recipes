name        : libluv
version     : "1.53.0"
release     : 3
homepage    : https://github.com/luvit/luv
upstreams   :
    - https://github.com/luvit/luv/releases/download/1.53.0-0/luv-1.53.0-0.tar.gz : ce6260efb974647e7687f54a54a6810bc5eb81cdc14b45b69868a5ea048f96e1
summary     : Bare libuv bindings for lua 
description : |
    This library makes libuv available to lua scripts.
license     : Apache-2.0
builddeps   :
    - cmake(libuv)
    - pkgconfig(luajit)
setup       : |
    %cmake \
        -DWITH_SHARED_LIBUV=ON \
        -DLUA_BUILD_TYPE=System \
        -DBUILD_MODULE=OFF \
        -DBUILD_SHARED_LIBS=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
