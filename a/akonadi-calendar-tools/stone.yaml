name        : akonadi-calendar-tools
version     : "26.08.2"
release     : 2
upstreams   :
    - https://download.kde.org/stable/release-service/26.08.2/src/akonadi-calendar-tools-26.08.2.tar.xz : f500b5b9fe9d34a3fd03f7e9c2a9cd9930f9d67ce66b31826826de508e2501dc
homepage    : https://invent.kde.org/pim/akonadi-calendar-tools
license     :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
summary     : Console tools for managing Akonadi calendars
description : |
    A collection of command-line tools for managing calendars stored in Akonadi, including konsolekalendar.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CalendarCore)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
    - cmake(KPim6Akonadi)
    - cmake(KPim6AkonadiCalendar)
    - cmake(KPim6CalendarSupport)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-docs":
        paths:
            - /usr/share/doc
