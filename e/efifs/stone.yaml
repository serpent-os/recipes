name        : efifs
version     : "1.13"
release     : 4
homepage    : https://github.com/pbatard/EfiFs
upstreams   :
    - https://github.com/pbatard/EfiFs/archive/refs/tags/v1.13.tar.gz:
        hash: 39f0e7f55e68d747ad66b1054cd1629e5b9ce9760a5d59020577ae2121f39723
        unpackdir: edk2/EfiFsPkg
    - https://gitlab.freedesktop.org/gnu-grub/grub/-/archive/grub-2.16/grub-grub-2.16.tar.gz:
        hash: 14a222a275971030999a3604fd6cc9403dcdb236540dce7ebaf44cd5324622b4
        unpackdir: edk2/EfiFsPkg/grub
    - https://github.com/tianocore/edk2/archive/refs/tags/edk2-stable202608.tar.gz:
        hash: bac40812213576c3025cf780c33d882f9e087a44201b1cd28a07f6d1eb54b76a
        unpackdir: edk2
summary     : EFI FileSystem drivers
description : |
    This is a GPLv3+ implementation of standalone EFI File System drivers, based on the GRUB 2.0 read-only drivers.
    For additional info as well as precompiled drivers, see https://efi.akeo.ie
license     : GPL-3.0-or-later
builddeps   :
    - binary(as)
    - binary(nasm)
    - binary(python3)
    - pkgconfig(uuid)
setup       : |
    %patch %(pkgdir)/use-clang.patch

    # change into edk2 folder
    cd ..

    # error: variable '_' set but not used
    %patch %(pkgdir)/ftbfs-clang23.patch

    # Do not build BrotliCompress (because it's unused) (from fedora)
    sed -e '/BrotliCompress/d' -i BaseTools/Source/C/GNUmakefile

    # Remove include path pointing to unused sub-module (from fedora)
    sed -e '/mipisyst/d' -i MdePkg/MdePkg.dec

    cd EfiFsPkg/grub
    %patch ../0001-GRUB-fixes.patch
build       : |
    chmod +x set_grub_cpu.sh
    cd ..
    %make -C BaseTools

    export WORKSPACE=${PWD}
    export CONF_PATH=${WORKSPACE}/Conf
    export EDK_TOOLS_PATH=${WORKSPACE}/BaseTools
    export PYTHON_COMMAND=python3

    source edksetup.sh --reconfig
    ./EfiFsPkg/set_grub_cpu.sh 'X64'

    # from edk2 recipe
    _build_options=(
        -a "X64"
        -b "RELEASE"
        -n "%(jobs)"
        -p EfiFsPkg/EfiFsPkg.dsc
        -t "CLANGDWARF"
    )
    build "${_build_options[@]}"
install     : |
    cd ..
    %install_exe Build/EfiFs/RELEASE_CLANGDWARF/X64/*.efi -t %(installroot)%(libdir)/efifs-x64
