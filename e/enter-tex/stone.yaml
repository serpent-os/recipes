name        : enter-tex
version     : "3.51.0"
release     : 3
homepage    : https://gitlab.gnome.org/World/gedit/enter-tex
upstreams   :
    - git|https://gitlab.gnome.org/World/gedit/enter-tex.git : 3c7f4551316d8de162353af535baaf7e4aaeb82b
