name        : freetype
version     : "2.15.0"
release     : 21
homepage    : http://freetype.org
upstreams   :
    - https://sourceforge.net/projects/freetype/files/freetype2/2.15.0/freetype-2.15.0.tar.xz : 93cd47eb719c325107f2d3cf087d06299e944c3b48a40b55537302304dea1dd5
summary     : Library to rasterize glyphs from font files
description : |
    freetype is a font rasterizer library written in C, designed to be small, efficient, highly customizable, and portable while capable of producing high-quality output (glyph images) of most vector and bitmap font formats.
license     :
    - FTL OR GPL-2.0-or-later  # main library
    - MIT                      # BDF/PCF font drivers (src/bdf, src/pcf) and hashing code (src/base/fthash.c)
    - MIT-Modern-Variant       # HarfBuzz-derived autofit code (src/autofit/ft-hb-*.{c,h}, hb-script-list.h)
    - Zlib                     # gzip compression module (src/gzip)
builddeps   :
    - binary(python3)
    - pkgconfig32(bzip2)
    - pkgconfig32(libbrotlidec)
    - pkgconfig32(libpng)
    - pkgconfig32(zlib)
# harfbuzz is dlopen()ed at runtime (-Dharfbuzz=dynamic); should be a recommends
emul32      : true
profiles    :
    - emul32:
        setup: |
            %patch %(pkgdir)/long-names.patch
            %patch %(pkgdir)/modules.patch
            %patch %(pkgdir)/subpixel.patch
            # Currently the emul32 chain for harfbuzz is on the large side. Revisit
            %meson \
                -Dharfbuzz=disabled
        build: |
            %meson_build
        install: |
            %meson_install
setup       : |
    %patch %(pkgdir)/long-names.patch
    %patch %(pkgdir)/modules.patch
    %patch %(pkgdir)/subpixel.patch
    %meson \
        -Dharfbuzz=dynamic
build       : |
    %meson_build
install     : |
    %meson_install
