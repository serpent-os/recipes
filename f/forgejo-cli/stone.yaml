name        : forgejo-cli
version     : "0.7.0"
release     : 3
homepage    : https://codeberg.org/forgejo-contrib/forgejo-cli
upstreams   :
    - https://codeberg.org/forgejo-contrib/forgejo-cli/archive/v0.7.0.tar.gz : 748ce60eb18e72af83ef3956910933b1e091abf673f12ff9777aea214f6eae40
summary     : CLI application for interacting with Forgejo
description : |
    fj is a CLI client for Forgejo, akin to gh, glab, or tea. It handles
    Forgejo-specific tasks such as issues, pull requests, repositories,
    organizations, and releases from the command line, working alongside git.
license     :
    - Apache-2.0
    - MIT
networking  : true
builddeps   :
    - pkgconfig(libgit2)
    - pkgconfig(libssh2)
    - pkgconfig(openssl)
environment : |
    # Force use of system libs
    export LIBGIT2_NO_VENDOR=1
    export LIBSSH2_SYS_USE_PKG_CONFIG=1
    export OPENSSL_NO_VENDOR=true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build --all-features
install     : |
    %cargo_install fj

    %(cargo_target_dir)/fj completion bash | %install_file /dev/stdin %(installroot)%(bashcompletionsdir)/fj
    %(cargo_target_dir)/fj completion zsh | %install_file /dev/stdin %(installroot)%(zshcompletionsdir)/_fj
    %(cargo_target_dir)/fj completion fish | %install_file /dev/stdin %(installroot)%(fishcompletionsdir)/fj.fish
check       : |
    %cargo_test --all-features
