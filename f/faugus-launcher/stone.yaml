name        : faugus-launcher
version     : "2.5.1"
release     : 25
homepage    : https://github.com/Faugus/faugus-launcher
upstreams   :
    - https://github.com/Faugus/faugus-launcher/archive/refs/tags/2.5.1.tar.gz : 0d0ae82febf6b3924b975f79f277887edc9364de67be89831514400cd94b6db6
summary     : A simple and lightweight app for running Windows games using UMU-Launcher
description : |
    A simple and lightweight app for running Windows games using UMU-Launcher
license     : MIT
builddeps   :
    - binary(gtk4-update-icon-cache)
    - binary(msgfmt)
rundeps     :
    - binary(python3)
    - python(dbus-python)
    - python(icoextract)
    - python(pillow)
    - python(psutil)
    - python(pygobject)
    - python(requests)
    - python(vdf)
    - gtk-4
    - libadwaita
    - libmanette
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
