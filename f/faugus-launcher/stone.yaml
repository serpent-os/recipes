name        : faugus-launcher
version     : "2.5.0"
release     : 24
homepage    : https://github.com/Faugus/faugus-launcher
upstreams   :
    - https://github.com/Faugus/faugus-launcher/archive/refs/tags/2.5.0.tar.gz : fda35bae35b8ad3ecbd254a709a3bea9b7ce56e0b4c0bf691a1c9470583f4c9c
summary     : A simple and lightweight app for running Windows games using UMU-Launcher
description : |
    A simple and lightweight app for running Windows games using UMU-Launcher
license     : MIT
builddeps   :
    - binary(gtk4-update-icon-cache)
    - binary(msgfmt)
rundeps     :
    - binary(python3)
    - python(dbus-python)
    - python(icoextract)
    - python(pillow)
    - python(psutil)
    - python(pygobject)
    - python(requests)
    - python(vdf)
    - gtk-4
    - libadwaita
    - libmanette
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
