name        : f2fs-tools
version     : "1.17.0"
release     : 6
homepage    : https://git.kernel.org/cgit/linux/kernel/git/jaegeuk/f2fs-tools.git/about/
upstreams   :
    - https://git.kernel.org/pub/scm/linux/kernel/git/jaegeuk/f2fs-tools.git/snapshot/f2fs-tools-1.17.0.tar.gz : 1dbc89ada373b43cc9130b47ad3f575117583ca74715e952046c88a121a2a469
summary     : Userland tools for the f2fs filesystem
description : |
    f2fs-tools are a collection of tools for Flash-Friendly File System (F2FS).
    It allows to format, mount, check and doing other operations on F2FS partitions.
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps  :
    - binary(bison)
    - binary(flex)
    - pkgconfig(blkid)
    - pkgconfig(libacl)
    - pkgconfig(liblz4)
    - pkgconfig(lzo2)
    - pkgconfig(uuid)
    # selinux
setup      : |
    %autogen \
        --disable-static
build       : |
    %make
install     : |
    %make_install
