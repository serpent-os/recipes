name        : dtc
version     : "1.8.1"
release     : 7
homepage    : https://github.com/dgibson/dtc.git
upstreams   :
    - https://github.com/dgibson/dtc/archive/refs/tags/v1.8.1.tar.gz : 74b50bb19134f6562490afea53e59953dd6c4afb17e5ccb60be32221262d3390
summary     : Device Tree Compiler
description : |
    Device Tree Compiler
license     : BSD-2-Clause
builddeps   :
    - binary(bison)
    - binary(flex)
    - binary(swig)
    - pkgconfig(python3)
    - pkgconfig(yaml-0.1)
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
    rm %(installroot)%(libdir)/*.a -v
check       : |
    # meson_test passes --no-rebuild, need to rebuild for test exes
    meson test --print-errorlogs --verbose -j "%(jobs)" -C "%(builddir)"
