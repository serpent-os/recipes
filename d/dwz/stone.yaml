name        : dwz
version     : "0.17"
release     : 3
homepage    : https://sourceware.org/dwz/
upstreams   :
    - https://sourceware.org/ftp/dwz/releases/dwz-0.17.tar.xz : db10030528f3365c03755969619dd6789147d34fc588db8107364351085aebad
summary     : DWARF optimization and duplicate removal tool
description : |
    DWARF optimization and duplicate removal tool
license     : GPL-2.0-or-later
builddeps   :
    - binary(readelf)
    - pkgconfig(libelf)
    - pkgconfig(libxxhash)
# checkdeps   :
#     - binary(runtest)
setup       : |
    %patch %(pkgdir)/0001-no-gold.patch -p2
    %patch %(pkgdir)/readelf.patch
build       : |
    %make \
        CFLAGS="%(cflags)" \
        LDFLAGS="%(ldflags)" \
        prefix=%(prefix) \
        mandir=%(mandir) \
        bindir=%(bindir)
install     : |
    %make_install \
        prefix=%(prefix) \
        mandir=%(mandir) \
        bindir=%(bindir)
# check       : |
