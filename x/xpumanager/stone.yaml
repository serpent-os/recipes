name        : xpumanager
version     : "2.3.0"
release     : 3
homepage    : https://intel.github.io/xpumanager/
upstreams   :
    - https://github.com/intel/xpumanager/archive/refs/tags/v2.3.0.tar.gz : f3f3f1a9328b4d6a0e14efe11815d9c7d3f8d25102968096816e1403eecc2e22
summary     : Free and open-source tool for monitoring and managing Intel Data Center GPUs.
description : |
    Free and open-source tool for monitoring and managing Intel Data Center GPUs.
license     : MIT
builddeps   :
    - cmake(igsc)
    - pkgconfig(CLI11)
    - pkgconfig(fmt)
    - pkgconfig(hwloc)
    - pkgconfig(level-zero)
    - pkgconfig(libcurl)
    - pkgconfig(libudev)
    - pkgconfig(nlohmann_json)
    - pkgconfig(pciaccess)
setup       : |
    %meson \
        -Dshared_library=true \
        -Duse_system_igsc=true \
        -Duse_system_levelzero=true
# -Dwith_tests=true
# requires doctest
build       : |
    %meson_build
install     : |
    %meson_install
# check       : |
#     %meson_test
packages    :
    - "%(name)":
        paths:
            - /usr/lib/libx*
