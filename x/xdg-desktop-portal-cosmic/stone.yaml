name        : xdg-desktop-portal-cosmic
version     : "1.11.0"
release     : 55
homepage    : https://github.com/pop-os/xdg-desktop-portal-cosmic
upstreams   :
    - https://github.com/pop-os/xdg-desktop-portal-cosmic/archive/refs/tags/epoch-1.11.0.tar.gz : 5befa4beda6ee231ebaa553b3db53d794500b5646de385fd1f576a7406242f16
summary     : Cosmic Desktop - XDG Portal Support
description : |
    Cosmic Desktop - XDG Portal Support
license     : GPL-3.0
builddeps   :
    - binary(just)
    - pkgconfig(gbm)
    - pkgconfig(glib-2.0)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(xkbcommon)
rundeps     :
    - binary(pipewire)
    - gvfs # Used for file services
    - xdg-desktop-portal
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    CARGO_TARGET_DIR="target/%(target_triple)" just rootdir=%(installroot) install
