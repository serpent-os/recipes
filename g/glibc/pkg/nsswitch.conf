# Default Name Service Switch configuration for aerynOS.
#
# This file is used when /etc/nsswitch.conf does not exist. To customise NSS,
# copy it to /etc/nsswitch.conf and edit that copy.

passwd:         files systemd
group:          files [SUCCESS=merge] systemd
shadow:         files systemd
gshadow:        files systemd

hosts:          mymachines resolve [!UNAVAIL=return] files myhostname dns
networks:       files

protocols:      db files
services:       db files
ethers:         db files
rpc:            db files

netgroup:       nis
