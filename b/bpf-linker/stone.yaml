name        : bpf-linker
version     : "0.12.0"
release     : 3
upstreams   :
    - https://github.com/aya-rs/bpf-linker/archive/refs/tags/v0.12.0.tar.gz: b338f41fb9bb690693eaa9021bb1c28e6dfe894ad5ff60385a0343aa269c0c02
homepage    : https://github.com/aya-rs/bpf-linker
license     :
    - Apache-2.0
    - MIT
summary     : Simple BPF static linker
description : |
    BPF static linker
builddeps   :
    # Needs to match whatever Rust is using, which I _think_ just means the system llvm
    - binary(llvm-config-23)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
    %install_file README.md "%(installroot)%(datadir)/doc/bpf-linker/README.md"
