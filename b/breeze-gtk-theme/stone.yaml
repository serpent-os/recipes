name        : breeze-gtk-theme
version     : "6.8.0"
release     : 23
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.0/breeze-gtk-6.8.0.tar.xz : 62046b9538e542a3682e195ac3409605cbaa16f03ffc78d1b7715de2a1e2409c
homepage    : https://kde.org/plasma-desktop/
license     :
    - BSD-3-Clause
    - LGPL-2.1-only
summary     : GTK Theme Built to Match KDE's Breeze
description : |
    A GTK Theme Built to Match KDE's Breeze
builddeps   :
    - binary(python3)
    - binary(sassc)
    - cmake(Breeze)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - pkgconfig(cairo)
    - python(pycairo)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
