name        : breeze-gtk-theme
version     : "6.8.1"
release     : 24
upstreams   :
    - https://download.kde.org/stable/plasma/6.8.1/breeze-gtk-6.8.1.tar.xz : 552cd0ecc357ea47d190ed691093bf32962795feba9a4c8e993faf0dd1c80557
homepage    : https://kde.org/plasma-desktop/
license     :
    - BSD-3-Clause
    - LGPL-2.1-only
summary     : GTK Theme Built to Match KDE's Breeze
description : |
    A GTK Theme Built to Match KDE's Breeze
builddeps   :
    - binary(python3)
    - binary(sassc)
    - cmake(Breeze)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - pkgconfig(cairo)
    - python(pycairo)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
