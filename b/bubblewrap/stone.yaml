name        : bubblewrap
version     : "0.13.1"
release     : 10
homepage    : https://github.com/containers/bubblewrap
upstreams   :
    - https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz : 0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d
summary     : Low-level unprivileged sandboxing tool used by Flatpak and similar projects
description : |
    Low-level unprivileged sandboxing tool used by Flatpak and similar projects
license     : LGPL-2.1-or-later
builddeps   :
    - binary(bash)
    - binary(python3)
    - binary(xsltproc)
    - pkgconfig(libcap)
    - docbook-xsl
    # libselinux
environment : |
    %export_docbook_catalogs
setup       : |
    # assume_kernel should match the min kernel in glibc
    %meson \
        -Dassume_kernel=6.1.0
build       : |
    %meson_build
install     : |
    %meson_install
check       : |
    # libtest.sh hardcodes mktemp -d /var/tmp, which does not exist in the build root
    mkdir -p /var/tmp
    # test-run.sh aborts (SIGABRT) in the build container, matching Arch's "Broken in our
    # build containers" note
    %meson_test --exclude test-run.sh
