name        : inotify-tools
version     : "4.26.270"
release     : 3
homepage    : https://github.com/inotify-tools/inotify-tools
upstreams   :
    - https://github.com/inotify-tools/inotify-tools/releases/download/4.26.270/inotify-tools-4.26.270.tar.gz : cfee168ed9fd914178e586e3ccb9b1180ae1cf33776f9ab2db16c54b9c0662a5
summary     : inotify-tools is a library and a set of command-line programs providing a simple interface to inotify
description : |
    This is a package of some commandline utilities relating to inotify.

    The general purpose of this package is to allow inotify's features to be used from within shell scripts.
    Read the man pages for further details.
license     :
    - GPL-2.0-or-later
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %make prefix=%(prefix)
install     : |
    %make_install prefix=%(prefix)
