name        : iio-niri
version     : "2.3.2"
release     : 2
homepage    : https://github.com/Zhaith-Izaliel/iio-niri
upstreams   :
    - https://github.com/Zhaith-Izaliel/iio-niri/archive/refs/tags/v2.3.2.tar.gz : d8caf5724c84deebdb62b077f485aba65ea90477f6d6556677e4d0dbf6bd6bf6
summary     : iio-sensor-proxy integration for Niri
description : |
    Listens to iio-sensor-proxy and updates Niri output orientation depending on the accelerometer orientation.
license     : MIT
builddeps   :
    - pkgconfig(dbus-1)
rundeps     :
    - iio-sensor-proxy
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
