name        : sushi
version     : "51.2"
release     : 5
homepage    : https://gitlab.gnome.org/GNOME/sushi
upstreams   :
    - https://gitlab.gnome.org/GNOME/sushi/-/archive/51.2/sushi-51.2.tar.gz : 3e5aeda3fa5f7bb5e8a7fb000593d9f91795ce312e5bab1d7d78ab6cbba2377e
